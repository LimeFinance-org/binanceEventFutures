# docker compose -f deploy/docker-compose.yml up -d --build
x-common: &common
  build: {context: .., dockerfile: deploy/Dockerfile}
  volumes:
    - ../data:/opt/becai/data
    - ../runs:/opt/becai/runs
    - ../registry:/opt/becai/registry
    - ../config:/opt/becai/config
  restart: unless-stopped

services:
  web:                       # 控制台 + 调度器 + 训练任务（训练子进程由它启动，所以需要 GPU）
    <<: *common
    command: python3 -m becai.cli web --host 0.0.0.0 --with-scheduler
    ports: ["127.0.0.1:8600:8600"]     # 默认只监听本机，远程请走 SSH 隧道
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  live:                      # 实时预测：纯 CPU，绑定专用核心，与训练隔离
    <<: *common
    command: python3 -m becai.cli live
    environment: {CUDA_VISIBLE_DEVICES: ""}
    cpuset: "0-3"
