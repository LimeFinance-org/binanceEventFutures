[project]
name = "becai"
version = "0.1.0"
description = "币安事件合约 AI 自动训练与预测系统"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["becai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
